<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#070708" />
<title>Glass Hero · 视觉复刻 Demo — LLM Bench</title>
<style>
  html, body { margin: 0; height: 100%; background: #070708; overflow: hidden; }
  body { font: 13px/1.5 -apple-system, "SF Pro Text", "PingFang SC", sans-serif; color: #8a8a92; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .hint {
    position: fixed; right: 18px; bottom: 16px; z-index: 2;
    font-size: 11.5px; color: #6f6f78; background: rgba(20,20,24,.66);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.10); border-radius: 10px; padding: 7px 11px;
    user-select: none;
  }
  .back { position: fixed; left: 18px; bottom: 16px; z-index: 2; color: #6f6f78; text-decoration: none;
    font-size: 11.5px; background: rgba(20,20,24,.66); border: 1px solid rgba(255,255,255,.10);
    border-radius: 10px; padding: 7px 11px; }
  .back:hover { color: #d7d7da; }
</style>
</head>
<body>
<canvas id="stage" aria-label="玻璃折射视觉演示：移动鼠标，玻璃球会跟随并折射背后文字"></canvas>
<a class="back" href="/">← LLM Bench</a>
<div class="hint">移动鼠标 — 玻璃球跟随并折射背后文字 · 原生 WebGL 复刻 Spline「Distorting Typography」</div>
<script src="/static/glass-hero.js"></script>
<script>
  GlassHero.mount(document.getElementById('stage'), {
    lines: ['DISTORTING!', 'PUSHING BEYOND', 'THE LIMITS OF', 'TYPOGRAPHIC', 'GLASS REFLECTION'],
  });
</script>
</body>
</html>
