[project]
name = "llm-bench"
version = "0.3.0"
description = "第三方 LLM 中转 API 性能与稳定性测试平台（OpenAI 兼容 + Anthropic）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "tiktoken>=0.7",
    "pydantic>=2.7",
    "apscheduler>=3.10",
    "lm-eval[api]>=0.4.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
