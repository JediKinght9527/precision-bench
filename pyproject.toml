[project]
name = "llm-bench"
version = "0.3.0"
description = "Evidence-first performance, cache, and quality verification for LLM relay APIs"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["llm", "benchmark", "prompt-cache", "relay-api", "observability", "slo"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "tiktoken>=0.7",
    "pydantic>=2.7",
    "apscheduler>=3.10",
    "lm-eval[api]>=0.4.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=server --cov-report=term-missing"

[tool.coverage.run]
source = ["server"]
branch = true
omit = ["server/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 55
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
